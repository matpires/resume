<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>job-hunter</title>
<style>
  :root {
    --bg: #f6f7f9;
    --panel: #ffffff;
    --border: #e2e5ea;
    --text: #15181d;
    --muted: #6b7280;
    --accent: #2563eb;
    --new: #047857;
    --new-bg: #ecfdf5;
    --chip: #f1f3f6;
    --shadow: 0 1px 2px rgba(16, 20, 28, .06), 0 4px 12px rgba(16, 20, 28, .04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101216;
      --panel: #171a1f;
      --border: #272b33;
      --text: #e8eaed;
      --muted: #9aa3af;
      --accent: #7aa2f7;
      --new: #6ee7b7;
      --new-bg: #06281f;
      --chip: #21252c;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 28px 16px 64px; }

  header h1 { margin: 0; font-size: 22px; letter-spacing: -.01em; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }

  .cards { display: flex; flex-wrap: wrap; gap: 10px; margin: 20px 0; }
  .card {
    flex: 1 1 130px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px 14px; box-shadow: var(--shadow);
  }
  .card b { display: block; font-size: 24px; font-weight: 600; letter-spacing: -.02em; }
  .card span { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }

  .toolbar {
    position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 8px;
    padding: 12px; margin-bottom: 14px; background: var(--panel);
    border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow);
  }
  input[type=search], select {
    font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px;
  }
  input[type=search] { flex: 1 1 240px; min-width: 0; }
  input[type=search]:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .toggle { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; }

  .count { margin: 0 0 10px; color: var(--muted); font-size: 13px; }

  .job {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    margin-bottom: 8px; box-shadow: var(--shadow); overflow: hidden;
  }
  .job > summary {
    display: grid; grid-template-columns: 1fr auto; gap: 4px 12px;
    padding: 12px 14px; cursor: pointer; list-style: none;
  }
  .job > summary::-webkit-details-marker { display: none; }
  .job > summary:hover { background: var(--chip); }
  .title { font-weight: 600; letter-spacing: -.01em; }
  .sub { color: var(--muted); font-size: 13px; }
  .right { text-align: right; color: var(--muted); font-size: 12px; white-space: nowrap; }
  .tag {
    display: inline-block; padding: 1px 7px; border-radius: 99px; background: var(--chip);
    font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted);
  }
  .tag.is-new { background: var(--new-bg); color: var(--new); }
  .tag.score { background: var(--new-bg); color: var(--new); text-transform: none; letter-spacing: 0; }

  .body { padding: 0 14px 14px; border-top: 1px solid var(--border); }
  .body .meta { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0; }
  .body pre {
    margin: 0; max-height: 380px; overflow: auto; white-space: pre-wrap;
    font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--border); border-radius: 8px; padding: 12px;
  }
  .analysis {
    margin: 0 0 12px; padding: 10px 12px; border-left: 3px solid var(--new);
    background: var(--new-bg); border-radius: 0 8px 8px 0; font-size: 14px;
  }
  .analysis p { margin: 0 0 6px; }
  .analysis p:last-child { margin-bottom: 0; }
  .analysis .k { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  a { color: var(--accent); }
  .apply { display: inline-block; margin-top: 12px; font-weight: 600; }

  .empty {
    background: var(--panel); border: 1px dashed var(--border); border-radius: 10px;
    padding: 28px; text-align: center; color: var(--muted);
  }
  .empty code { color: var(--text); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>job-hunter</h1>
    <p id="stamp">carregando…</p>
  </header>

  <div class="cards" id="cards"></div>

  <div class="toolbar">
    <input type="search" id="q" placeholder="Buscar em titulo, empresa, local e descricao…" autocomplete="off">
    <select id="company"></select>
    <select id="ats"></select>
    <select id="sort">
      <option value="posted">Publicacao mais recente</option>
      <option value="seen">Vista pela primeira vez</option>
      <option value="company">Empresa</option>
      <option value="title">Titulo</option>
      <option value="score">Score</option>
    </select>
    <label class="toggle" id="onlyShortWrap"><input type="checkbox" id="onlyShort"> so shortlist</label>
    <label class="toggle"><input type="checkbox" id="onlyNew"> so novas</label>
    <label class="toggle"><input type="checkbox" id="onlyRemote"> so remoto</label>
  </div>

  <p class="count" id="count"></p>
  <div id="list"></div>
</div>

<!-- gerado por src/report.py a cada coleta; se nao existir, a pagina avisa.
     Na versao publicada (src/publish.py) esta linha vira os dados cifrados. -->
<script>window.JOBS_LOCKED = true;</script>
<script>
// Recebe os dados e monta a pagina. Aqui os dados vem de data.js; na versao
// publicada, vem da tela de senha, depois de decifrados no navegador.
function startJobs(DATA) {
  var list = document.getElementById('list');

  if (!DATA) {
    document.getElementById('stamp').textContent = 'sem dados';
    list.innerHTML = '<div class="empty">Nenhum dado ainda.<br>Rode <code>python src/collect.py</code> ' +
      'e recarregue esta pagina.</div>';
    return;
  }

  var JOBS = DATA.jobs || [];
  var META = DATA.meta || {};
  var runDate = META.run_date || '';

  function txt(v) { return (v === null || v === undefined) ? '' : String(v); }
  function isRemote(j) {
    return /remote|remoto|anywhere/i.test(txt(j.remote) + ' ' + txt(j.location));
  }
  function isNew(j) { return runDate && j.first_seen === runDate; }
  function dateOf(j) { return txt(j.posted_at) || txt(j.first_seen); }
  function day(v) { return txt(v).slice(0, 10); }

  // ---- cabecalho
  var when = new Date(DATA.generated_at);
  document.getElementById('stamp').textContent =
    'Atualizado em ' + (isNaN(when) ? txt(DATA.generated_at) : when.toLocaleString('pt-BR')) +
    ' · gerado por src/collect.py';

  var companies = Array.from(new Set(JOBS.map(function (j) { return j.company; }))).sort();
  var cards = [
    ['vagas', JOBS.length],
    ['novas na ultima coleta', META.new_today || 0],
    ['empresas com vaga', companies.length],
    ['empresas monitoradas', (META.companies || []).length],
    ['sem board', (META.unresolved || []).length],
    ['falhas de coleta', (META.failed || []).length]
  ];
  document.getElementById('cards').innerHTML = cards.map(function (c) {
    return '<div class="card"><b>' + c[1] + '</b><span>' + c[0] + '</span></div>';
  }).join('');

  // ---- filtros
  function fill(select, values, allLabel) {
    select.innerHTML = '<option value="">' + allLabel + '</option>' +
      values.map(function (v) { return '<option>' + v + '</option>'; }).join('');
  }
  fill(document.getElementById('company'), companies, 'Todas as empresas');
  fill(document.getElementById('ats'),
    Array.from(new Set(JOBS.map(function (j) { return j.ats; }))).sort(), 'Todos os ATS');

  var hasScore = JOBS.some(function (j) { return j.score !== undefined && j.score !== ''; });
  var sortEl = document.getElementById('sort');
  if (!hasScore) {
    sortEl.querySelector('option[value=score]').remove();
    document.getElementById('onlyShortWrap').style.display = 'none';
  } else {
    sortEl.value = 'score';
    document.getElementById('onlyShort').checked = true;
  }

  var controls = ['q', 'company', 'ats', 'sort', 'onlyNew', 'onlyRemote', 'onlyShort'].map(function (id) {
    return document.getElementById(id);
  });

  function esc(s) {
    return txt(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  // Analise do score.py: resumo, local, o que falta e bullets que casam.
  function analysis(j) {
    var a = j.analysis;
    if (!a) return '';
    var out = '<div class="analysis"><p>' + esc(a.summary) + '</p>';
    if (a.location) out += '<p><span class="k">Local</span> ' + esc(a.location) + '</p>';
    if (a.missing && a.missing.length) out += '<p><span class="k">Falta</span> ' + esc(a.missing.join('; ')) + '</p>';
    if (a.bullets && a.bullets.length) out += '<p><span class="k">Bullets</span> ' + esc(a.bullets.join(', ')) + '</p>';
    return out + '</div>';
  }

  function render() {
    var q = controls[0].value.trim().toLowerCase();
    var company = controls[1].value, ats = controls[2].value, sort = controls[3].value;
    var onlyNew = controls[4].checked, onlyRemote = controls[5].checked, onlyShort = controls[6].checked;

    var rows = JOBS.filter(function (j) {
      if (company && j.company !== company) return false;
      if (ats && j.ats !== ats) return false;
      if (onlyNew && !isNew(j)) return false;
      if (onlyShort && !j.shortlist) return false;
      if (onlyRemote && !isRemote(j)) return false;
      if (!q) return true;
      var hay = [j.title, j.company, j.location, j.department, j.description].join(' ').toLowerCase();
      return q.split(/\s+/).every(function (term) { return hay.indexOf(term) !== -1; });
    });

    rows.sort(function (a, b) {
      if (sort === 'company') return (a.company + a.title).localeCompare(b.company + b.title);
      if (sort === 'title') return txt(a.title).localeCompare(txt(b.title));
      if (sort === 'seen') return txt(b.first_seen).localeCompare(txt(a.first_seen));
      if (sort === 'score') return (Number(b.score) || 0) - (Number(a.score) || 0);
      return dateOf(b).localeCompare(dateOf(a));
    });

    document.getElementById('count').textContent =
      rows.length + ' de ' + JOBS.length + ' vagas';

    list.innerHTML = rows.map(function (j) {
      var tags = [];
      if (isNew(j)) tags.push('<span class="tag is-new">nova</span>');
      if (j.score !== undefined && j.score !== '') tags.push('<span class="tag score">score ' + esc(j.score) + '</span>');
      if (isRemote(j)) tags.push('<span class="tag">remoto</span>');
      tags.push('<span class="tag">' + esc(j.ats) + '</span>');
      if (j.department) tags.push('<span class="tag">' + esc(j.department) + '</span>');
      if (j.salary) tags.push('<span class="tag">' + esc(j.salary) + '</span>');
      (j.flags || []).forEach(function (f) { tags.push('<span class="tag">' + esc(f) + '</span>'); });

      return '' +
        '<details class="job">' +
          '<summary>' +
            '<div>' +
              '<div class="title">' + esc(j.title) + '</div>' +
              '<div class="sub">' + esc(j.company) + (j.location ? ' · ' + esc(j.location) : '') + '</div>' +
            '</div>' +
            '<div class="right">' +
              (j.score !== undefined && j.score !== '' ? '<span class="tag score">' + esc(j.score) + '</span> ' : '') +
              (isNew(j) ? '<span class="tag is-new">nova</span><br>' : '') +
              (day(j.posted_at) ? 'publicada ' + day(j.posted_at) + '<br>' : '') +
              'vista ' + day(j.first_seen) +
            '</div>' +
          '</summary>' +
          '<div class="body">' +
            '<div class="meta">' + tags.join('') + '</div>' +
            analysis(j) +
            '<pre>' + esc(j.description || '(sem descricao)') + '</pre>' +
            (j.url ? '<a class="apply" href="' + esc(j.url) + '" target="_blank" rel="noopener">Abrir a vaga no site da empresa →</a>' : '') +
          '</div>' +
        '</details>';
    }).join('') || '<div class="empty">Nenhuma vaga com esses filtros.</div>';
  }

  controls.forEach(function (el) {
    el.addEventListener(el.type === 'checkbox' || el.tagName === 'SELECT' ? 'change' : 'input', render);
  });
  render();
}
if (!window.JOBS_LOCKED) startJobs(window.JOBS_DATA || null);
</script>

<style>
  #gate {
    position: fixed; inset: 0; z-index: 50; display: flex; align-items: center;
    justify-content: center; padding: 16px; background: var(--bg);
  }
  #gate form {
    width: 100%; max-width: 360px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 24px; box-shadow: var(--shadow);
  }
  #gate h1 { margin: 0 0 4px; font-size: 20px; }
  #gate p { margin: 0 0 16px; color: var(--muted); font-size: 13px; }
  #gate input[type=password] {
    width: 100%; font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--border); border-radius: 8px; padding: 9px 10px;
  }
  #gate button {
    width: 100%; margin-top: 12px; font: inherit; font-weight: 600; color: #fff;
    background: var(--accent); border: 0; border-radius: 8px; padding: 9px; cursor: pointer;
  }
  #gate button:disabled { opacity: .6; cursor: wait; }
  #gate .toggle { margin-top: 12px; }
  #gate .err { color: #dc2626; margin: 10px 0 0; min-height: 1.2em; font-size: 13px; }
</style>

    <p class="err" id="err"></p>

</div>

  var KEY = 'job-hunter-pw';
  function bytes(s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); }

  async function unlock(pw) {
    var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    var key = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: bytes(ENC.salt), iterations: ENC.iter, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    var plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(ENC.iv) }, key, bytes(ENC.data));
    var stream = new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'));
    return JSON.parse(await new Response(stream).text());
  }

  function store(action, value) {
    try {
      if (action === 'get') return localStorage.getItem(KEY);
      if (action === 'set') localStorage.setItem(KEY, value);
      if (action === 'del') localStorage.removeItem(KEY);
    } catch (e) { /* navegacao privada: sem memoria, sem problema */ }
    return null;
  }

  async function attempt(pw, remember) {
    var btn = document.getElementById('go'), err = document.getElementById('err');
    btn.disabled = true; err.textContent = '';
    try {
      var data = await unlock(pw);
      if (remember) store('set', pw);
      document.getElementById('gate').remove();
      startJobs(data);
    } catch (e) {
      store('del');
      err.textContent = window.crypto && crypto.subtle ? 'Senha incorreta.' : 'Este navegador nao suporta a pagina.';
      btn.disabled = false;
    }
  }

  document.getElementById('gateForm').addEventListener('submit', function (ev) {
    ev.preventDefault();
    attempt(document.getElementById('pw').value, document.getElementById('remember').checked);
  });
  var saved = store('get');
  if (saved) attempt(saved, true);
})();
