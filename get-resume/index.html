<style>
/*
  Desenho da FOLHA do curriculo -- o que vira PDF.

  Vive separado porque tres saidas usam exatamente este desenho:
    resume.html          folha de trabalho, com o seletor de variantes
    get-resume/index.html  versao publica de uma variante
    index.html           home animada, que imprime a folha e nada mais

  Regra: tudo que e da folha fica dentro de .sheet, e tudo que e cromo de
  tela leva .no-print. Assim a home pode ter o desenho que quiser sem
  disputar seletor com a folha.
*/

:root{
  --paper:#ffffff;
  --ink:#16191d;
  --ink-soft:#5b646e;
  --rule:#d5dae0;
  --backdrop:#e9ebee;
  --chrome-ink:#16191d;
  --chrome-bg:#ffffff;
  --accent:#1f4e46;
  --flag:#f4e9cf;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --sans:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --backdrop:#14171a; --chrome-bg:#1d2125; --chrome-ink:#e6e9ec; --rule:#d5dae0;
  }
}
:root[data-theme="dark"]{
  --backdrop:#14171a; --chrome-bg:#1d2125; --chrome-ink:#e6e9ec;
}

*{box-sizing:border-box}

/* so nas paginas que sao a folha; a home tem body proprio */
body.sheet-page{
  margin:0; background:var(--backdrop); color:var(--ink);
  font-family:var(--serif); -webkit-font-smoothing:antialiased;
}

/* ------------------------------------------------------- cromo de tela */
.bar{
  position:sticky; top:0; z-index:10;
  display:flex; flex-wrap:wrap; gap:.5rem; align-items:center;
  padding:.7rem 1rem; background:var(--chrome-bg); color:var(--chrome-ink);
  border-bottom:1px solid rgba(128,138,148,.35);
  font-family:var(--sans); font-size:.82rem;
}
.bar .spacer{flex:1 1 auto}
.bar button{
  font:inherit; cursor:pointer; padding:.42rem .8rem; border-radius:3px;
  border:1px solid rgba(128,138,148,.5); background:transparent;
  color:inherit; transition:background .12s,border-color .12s;
}
.bar button:hover{background:rgba(128,138,148,.14)}
.bar button:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.bar button[aria-pressed="true"]{
  background:var(--accent); border-color:var(--accent); color:#fff; font-weight:500;
}
.bar .ghost{border-style:dashed}
label.check{display:flex; align-items:center; gap:.35rem; cursor:pointer}

.notice{
  max-width:52rem; margin:1rem auto -.4rem; padding:.7rem .9rem;
  background:var(--flag); color:#4a3c14; border-left:3px solid #c9a227;
  font-family:var(--sans); font-size:.78rem; line-height:1.5; border-radius:2px;
}
.notice b{font-weight:600}

/* ------------------------------------------------------------- a folha */
.sheet{
  max-width:52rem; margin:1.4rem auto 4rem; padding:3.2rem 3.4rem;
  background:var(--paper); color:var(--ink); font-family:var(--serif);
  box-shadow:0 1px 3px rgba(20,25,30,.14), 0 12px 32px rgba(20,25,30,.09);
}

.sheet .name{
  font-size:2.5rem; font-weight:700; letter-spacing:-.015em;
  line-height:1.05; margin:0;
}
.sheet .headline{
  font-size:1.02rem; font-weight:400; color:var(--ink-soft); margin:.35rem 0 0;
}
.sheet .contact{
  font-size:.86rem; color:var(--ink-soft); margin:.9rem 0 0; line-height:1.7;
}
.sheet .contact a{color:inherit}
.sheet .summary{
  font-size:.98rem; line-height:1.62; margin:1.5rem 0 0;
  padding-top:1.4rem; border-top:1px solid var(--rule);
}
.sheet h2{
  font-size:.95rem; font-weight:700; letter-spacing:.01em;
  margin:2.1rem 0 .1rem; padding-bottom:.3rem;
  border-bottom:1.5px solid var(--ink);
}
.sheet .job{margin-top:1.15rem; break-inside:avoid}
.sheet .job-head{display:flex; justify-content:space-between; gap:1rem; align-items:baseline}
.sheet .job-title{font-size:1rem; font-weight:700; margin:0}
.sheet .job-org{font-size:.92rem; color:var(--ink-soft); margin:.1rem 0 0}
.sheet .job-dates{font-size:.82rem; color:var(--ink-soft); white-space:nowrap}
.sheet ul{margin:.45rem 0 0; padding-left:1.1rem}
.sheet li{font-size:.92rem; line-height:1.55; margin-bottom:.3rem}
.sheet li::marker{color:var(--ink-soft)}
.sheet li.soft{background:linear-gradient(transparent 62%, #ffe9a8 62%)}
.sheet .cols{display:grid; grid-template-columns:1fr 1fr; gap:.2rem 2rem; margin-top:.7rem}
.sheet .entry{margin-bottom:.6rem; break-inside:avoid}
.sheet .entry-main{font-size:.92rem; font-weight:600}
.sheet .entry-sub{font-size:.85rem; color:var(--ink-soft)}
.sheet .skillrow{display:flex; gap:.6rem; font-size:.92rem; line-height:1.55; margin:.4rem 0}
.sheet .skillrow dt{font-weight:700; flex:0 0 9.5rem}
.sheet .skillrow dd{margin:0; color:var(--ink)}

@media (max-width:640px){
  .sheet{padding:1.9rem 1.4rem; margin:.8rem .6rem 3rem}
  .sheet .name{font-size:1.9rem}
  .sheet .cols{grid-template-columns:1fr}
  .sheet .skillrow{flex-direction:column; gap:.05rem}
  .sheet .skillrow dt{flex:none}
  .sheet .job-head{flex-direction:column}
}

/* ------------------------------------------------------------- impressao */
@page{margin:14mm 15mm}
@media print{
  :root{--backdrop:#fff; --ink:#000; --ink-soft:#3a4149}
  body{background:#fff !important}
  .no-print{display:none !important}
  .sheet{
    display:block !important;
    box-shadow:none; margin:0; padding:0; max-width:none;
  }
  .sheet li.soft{background:none}
  .sheet h2{margin-top:1.5rem}
  .sheet a{text-decoration:none; color:inherit}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important; animation:none !important}}

</style>

<script>
/*
  Renderizacao da FOLHA. Compartilhada pelas tres saidas (folha de trabalho,
  versao publica e home), para o desenho do PDF nao divergir entre elas.

  Espera window.RESUME_DATA, gerado por src/render_resume.py a partir do
  resume/master.yaml. Nao guarda dado nenhum.
*/

let DATA = null;

const esc = s => String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

// Escolhe os bullets de cada emprego: cada tag vale a posicao dela na
// prioridade da variante, e os melhores ficam -- na ordem original, para o
// texto nao embaralhar.
function pick(bullets, priority, max){
  const score = b => b.tags.reduce((t,tag)=>{
    const i = priority.indexOf(tag);
    return t + (i === -1 ? 0 : priority.length - i);
  },0);
  const chosen = bullets.map((b,i)=>({b,i,s:score(b)}))
    .sort((x,y)=> y.s - x.s || x.i - y.i)
    .slice(0,max)
    .sort((x,y)=> x.i - y.i);
  return chosen.map(x=>x.b);
}

function entries(list){
  return `<div class="cols">${list.map(e=>
    `<div class="entry"><div class="entry-main">${esc(e.main)}</div>
     <div class="entry-sub">${esc(e.sub)}</div></div>`).join("")}</div>`;
}

function render(key){
  const sheet = document.getElementById("sheet");
  if (!sheet) return;

  const v = DATA.variants[key], m = DATA.meta, S = DATA.strings || {};
  const contact = [m.email, m.phone, m.location, m.linkedin, m.github, m.note]
    .filter(Boolean).join(" · ");

  const jobs = DATA.experience.map(j=>{
    const bs = pick(j.bullets, v.tag_priority, v.max);
    return `<div class="job">
      <div class="job-head">
        <div><p class="job-title">${esc(j.title)}</p>
        <p class="job-org">${esc(j.company)}${j.context?" · "+esc(j.context):""}</p></div>
        <span class="job-dates">${esc(j.dates)}</span>
      </div>
      <ul>${bs.map(b=>`<li data-c="${b.c}">${esc(b.text)}</li>`).join("")}</ul>
    </div>`;
  }).join("");

  const skills = v.skills.map(k=>{
    const s = DATA.skills[k];
    return `<div class="skillrow"><dt>${esc(s.label)}</dt><dd>${esc(s.items.join(" · "))}</dd></div>`;
  }).join("");

  sheet.innerHTML = `
    <h1 class="name">${esc(m.name)}</h1>
    <p class="headline">${esc(v.headline)}</p>
    <p class="contact">${esc(contact)}</p>
    <p class="summary">${esc(v.summary)}</p>
    <h2>${esc(S.experience || "Experience")}</h2>${jobs}
    <h2>${esc(S.skills || "Skills")}</h2><dl>${skills}</dl>
    <h2>${esc(S.education || "Education")}</h2>${entries(DATA.education)}
    <h2>${esc(S.certificates || "Certifications")}</h2>${entries(DATA.certificates)}
    <h2>${esc(S.languages || "Languages")}</h2>
    <p class="contact" style="margin-top:.5rem">${esc(DATA.languages)}</p>`;

  document.title = `${m.name} — ${v.label}`;
  applyFlags();
}

// So existe na folha de trabalho; nas outras saidas o checkbox nao esta la.
function applyFlags(){
  const box = document.getElementById("flagSoft");
  const on = !!(box && box.checked);
  document.querySelectorAll("#sheet li").forEach(li=>{
    li.classList.toggle("soft", on && li.dataset.c !== "exact");
  });
}

</script>
<script>
DATA = window.RESUME_DATA;

</script>
