<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  :root{
    --paper:#ffffff;
    --ink:#16191d;
    --ink-soft:#5b646e;
    --rule:#d5dae0;
    --backdrop:#e9ebee;
    --chrome-ink:#16191d;
    --chrome-bg:#ffffff;
    --accent:#1f4e46;
    --flag:#f4e9cf;
    --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
    --sans:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --backdrop:#14171a; --chrome-bg:#1d2125; --chrome-ink:#e6e9ec; --rule:#d5dae0;
    }
  }
  :root[data-theme="dark"]{
    --backdrop:#14171a; --chrome-bg:#1d2125; --chrome-ink:#e6e9ec;
  }

  *{box-sizing:border-box}
  body{
    margin:0; background:var(--backdrop); color:var(--ink);
    font-family:var(--serif); -webkit-font-smoothing:antialiased;
  }

  /* ---------------------------------------------------------- chrome (screen) */
  .bar{
    position:sticky; top:0; z-index:10;
    display:flex; flex-wrap:wrap; gap:.5rem; align-items:center;
    padding:.7rem 1rem; background:var(--chrome-bg); color:var(--chrome-ink);
    border-bottom:1px solid rgba(128,138,148,.35);
    font-family:var(--sans); font-size:.82rem;
  }
  .bar .spacer{flex:1 1 auto}
  button{
    font:inherit; cursor:pointer; padding:.42rem .8rem; border-radius:3px;
    border:1px solid rgba(128,138,148,.5); background:transparent;
    color:inherit; transition:background .12s,border-color .12s;
  }
  button:hover{background:rgba(128,138,148,.14)}
  button:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
  button[aria-pressed="true"]{
    background:var(--accent); border-color:var(--accent); color:#fff; font-weight:500;
  }
  .ghost{border-style:dashed}
  label.check{display:flex; align-items:center; gap:.35rem; cursor:pointer}

  .notice{
    max-width:52rem; margin:1rem auto -.4rem; padding:.7rem .9rem;
    background:var(--flag); color:#4a3c14; border-left:3px solid #c9a227;
    font-family:var(--sans); font-size:.78rem; line-height:1.5; border-radius:2px;
  }
  .notice b{font-weight:600}

  /* ------------------------------------------------------------------- sheet */
  .sheet{
    max-width:52rem; margin:1.4rem auto 4rem; padding:3.2rem 3.4rem;
    background:var(--paper); color:var(--ink);
    box-shadow:0 1px 3px rgba(20,25,30,.14), 0 12px 32px rgba(20,25,30,.09);
  }

  .name{
    font-size:2.5rem; font-weight:700; letter-spacing:-.015em;
    line-height:1.05; margin:0;
  }
  .headline{
    font-size:1.02rem; font-weight:400; color:var(--ink-soft);
    margin:.35rem 0 0;
  }
  .contact{
    font-size:.86rem; color:var(--ink-soft); margin:.9rem 0 0; line-height:1.7;
  }
  .contact a{color:inherit}

  .summary{
    font-size:.98rem; line-height:1.62; margin:1.5rem 0 0;
    padding-top:1.4rem; border-top:1px solid var(--rule);
  }

  h2{
    font-size:.95rem; font-weight:700; letter-spacing:.01em;
    margin:2.1rem 0 .1rem; padding-bottom:.3rem;
    border-bottom:1.5px solid var(--ink);
  }

  .job{margin-top:1.15rem; break-inside:avoid}
  .job-head{display:flex; justify-content:space-between; gap:1rem; align-items:baseline}
  .job-title{font-size:1rem; font-weight:700; margin:0}
  .job-org{font-size:.92rem; color:var(--ink-soft); margin:.1rem 0 0}
  .job-dates{font-size:.82rem; color:var(--ink-soft); white-space:nowrap}
  ul{margin:.45rem 0 0; padding-left:1.1rem}
  li{font-size:.92rem; line-height:1.55; margin-bottom:.3rem}
  li::marker{color:var(--ink-soft)}
  li.soft{background:linear-gradient(transparent 62%, #ffe9a8 62%)}

  .cols{display:grid; grid-template-columns:1fr 1fr; gap:.2rem 2rem; margin-top:.7rem}
  .entry{margin-bottom:.6rem; break-inside:avoid}
  .entry-main{font-size:.92rem; font-weight:600}
  .entry-sub{font-size:.85rem; color:var(--ink-soft)}

  .skillrow{display:flex; gap:.6rem; font-size:.92rem; line-height:1.55; margin:.4rem 0}
  .skillrow dt{font-weight:700; flex:0 0 9.5rem}
  .skillrow dd{margin:0; color:var(--ink)}

  @media (max-width:640px){
    .sheet{padding:1.9rem 1.4rem; margin:.8rem .6rem 3rem}
    .name{font-size:1.9rem}
    .cols{grid-template-columns:1fr}
    .skillrow{flex-direction:column; gap:.05rem}
    .skillrow dt{flex:none}
    .job-head{flex-direction:column}
  }

  /* ------------------------------------------------------------------- print */
  @page{margin:14mm 15mm}
  @media print{
    :root{--backdrop:#fff; --ink:#000; --ink-soft:#3a4149}
    body{background:#fff}
    .bar,.notice{display:none !important}
    .sheet{box-shadow:none; margin:0; padding:0; max-width:none}
    li.soft{background:none}
    h2{margin-top:1.5rem}
    a{text-decoration:none; color:inherit}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none !important}}

let DATA = null;

const esc = s => String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function pick(bullets, priority, max){
  const score = b => b.tags.reduce((t,tag)=>{
    const i = priority.indexOf(tag);
    return t + (i === -1 ? 0 : priority.length - i);
  },0);
  const chosen = bullets.map((b,i)=>({b,i,s:score(b)}))
    .sort((x,y)=> y.s - x.s || x.i - y.i)
    .slice(0,max)
    .sort((x,y)=> x.i - y.i);
  return chosen.map(x=>x.b);
}

function entries(list){
  return `<div class="cols">${list.map(e=>
    `<div class="entry"><div class="entry-main">${esc(e.main)}</div>
     <div class="entry-sub">${esc(e.sub)}</div></div>`).join("")}</div>`;
}

function render(key){
  const v = DATA.variants[key], m = DATA.meta;
  const contact = [m.email, m.phone, m.location, m.linkedin, m.github, m.note]
    .filter(Boolean).join(" · ");

  const jobs = DATA.experience.map(j=>{
    const bs = pick(j.bullets, v.tag_priority, v.max);
    return `<div class="job">
      <div class="job-head">
        <div><p class="job-title">${esc(j.title)}</p>
        <p class="job-org">${esc(j.company)}${j.context?" · "+esc(j.context):""}</p></div>
        <span class="job-dates">${esc(j.dates)}</span>
      </div>
      <ul>${bs.map(b=>`<li data-c="${b.c}">${esc(b.text)}</li>`).join("")}</ul>
    </div>`;
  }).join("");

  const skills = v.skills.map(k=>{
    const s = DATA.skills[k];
    return `<div class="skillrow"><dt>${esc(s.label)}</dt><dd>${esc(s.items.join(" · "))}</dd></div>`;
  }).join("");

  document.getElementById("sheet").innerHTML = `
    <h1 class="name">${esc(m.name)}</h1>
    <p class="headline">${esc(v.headline)}</p>
    <p class="contact">${esc(contact)}</p>
    <p class="summary">${esc(v.summary)}</p>
    <h2>Experience</h2>${jobs}
    <h2>Skills</h2><dl>${skills}</dl>
    <h2>Education</h2>${entries(DATA.education)}
    <h2>Certifications</h2>${entries(DATA.certificates)}
    <h2>Languages</h2><p class="contact" style="margin-top:.5rem">${esc(DATA.languages)}</p>`;

  document.title = `Matheos Pires — ${v.label}`;
  applyFlags();
}

function applyFlags(){
  const box = document.getElementById("flagSoft");
  const on = !!(box && box.checked);
  document.querySelectorAll("#sheet li").forEach(li=>{
    li.classList.toggle("soft", on && li.dataset.c !== "exact");
  });
}

function buildNotice(){
  const el = document.getElementById("notice");
  if (!el) return;
  const open = (DATA && DATA.open_questions) || [];
  if (!open.length){ el.style.display = "none"; return; }
  el.innerHTML = `<b>Em aberto no master.yaml:</b><ul style="margin:.4rem 0 0;padding-left:1.1rem">`
    + open.map(q=>`<li>${esc(q)}</li>`).join("")
    + `</ul>O curriculo ja e utilizavel assim. Esta tarja nao vai para o PDF.`;
}

document.querySelectorAll("[data-variant]").forEach(btn=>{
  btn.addEventListener("click",()=>{
    document.querySelectorAll("[data-variant]").forEach(b=>b.setAttribute("aria-pressed","false"));
    btn.setAttribute("aria-pressed","true");
    render(btn.dataset.variant);
  });
});
const flagBox = document.getElementById("flagSoft");
if (flagBox) flagBox.addEventListener("change", applyFlags);
const printBtn = document.getElementById("printBtn");
if (printBtn) printBtn.addEventListener("click",()=>window.print());
