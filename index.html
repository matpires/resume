<style>
/* ===== desenho da folha (compartilhado, imprime) ===== */
/*
  Desenho da FOLHA do curriculo -- o que vira PDF.

  Vive separado porque tres saidas usam exatamente este desenho:
    resume.html          folha de trabalho, com o seletor de variantes
    get-resume/index.html  versao publica de uma variante
    index.html           home animada, que imprime a folha e nada mais

  Regra: tudo que e da folha fica dentro de .sheet, e tudo que e cromo de
  tela leva .no-print. Assim a home pode ter o desenho que quiser sem
  disputar seletor com a folha.
*/

:root{
  --paper:#ffffff;
  --ink:#16191d;
  --ink-soft:#5b646e;
  --rule:#d5dae0;
  --backdrop:#e9ebee;
  --chrome-ink:#16191d;
  --chrome-bg:#ffffff;
  --accent:#1f4e46;
  --flag:#f4e9cf;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --sans:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --backdrop:#14171a; --chrome-bg:#1d2125; --chrome-ink:#e6e9ec; --rule:#d5dae0;
  }
}
:root[data-theme="dark"]{
  --backdrop:#14171a; --chrome-bg:#1d2125; --chrome-ink:#e6e9ec;
}

*{box-sizing:border-box}

/* so nas paginas que sao a folha; a home tem body proprio */
body.sheet-page{
  margin:0; background:var(--backdrop); color:var(--ink);
  font-family:var(--serif); -webkit-font-smoothing:antialiased;
}

/* ------------------------------------------------------- cromo de tela */
.bar{
  position:sticky; top:0; z-index:10;
  display:flex; flex-wrap:wrap; gap:.5rem; align-items:center;
  padding:.7rem 1rem; background:var(--chrome-bg); color:var(--chrome-ink);
  border-bottom:1px solid rgba(128,138,148,.35);
  font-family:var(--sans); font-size:.82rem;
}
.bar .spacer{flex:1 1 auto}
.bar button{
  font:inherit; cursor:pointer; padding:.42rem .8rem; border-radius:3px;
  border:1px solid rgba(128,138,148,.5); background:transparent;
  color:inherit; transition:background .12s,border-color .12s;
}
.bar button:hover{background:rgba(128,138,148,.14)}
.bar button:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.bar button[aria-pressed="true"]{
  background:var(--accent); border-color:var(--accent); color:#fff; font-weight:500;
}
.bar .ghost{border-style:dashed}
label.check{display:flex; align-items:center; gap:.35rem; cursor:pointer}

.notice{
  max-width:52rem; margin:1rem auto -.4rem; padding:.7rem .9rem;
  background:var(--flag); color:#4a3c14; border-left:3px solid #c9a227;
  font-family:var(--sans); font-size:.78rem; line-height:1.5; border-radius:2px;
}
.notice b{font-weight:600}

/* ------------------------------------------------------------- a folha */
.sheet{
  max-width:52rem; margin:1.4rem auto 4rem; padding:3.2rem 3.4rem;
  background:var(--paper); color:var(--ink); font-family:var(--serif);
  box-shadow:0 1px 3px rgba(20,25,30,.14), 0 12px 32px rgba(20,25,30,.09);
}

.sheet .name{
  font-size:2.5rem; font-weight:700; letter-spacing:-.015em;
  line-height:1.05; margin:0;
}
.sheet .headline{
  font-size:1.02rem; font-weight:400; color:var(--ink-soft); margin:.35rem 0 0;
}
.sheet .contact{
  font-size:.86rem; color:var(--ink-soft); margin:.9rem 0 0; line-height:1.7;
}
.sheet .contact a{color:inherit}
.sheet .summary{
  font-size:.98rem; line-height:1.62; margin:1.5rem 0 0;
  padding-top:1.4rem; border-top:1px solid var(--rule);
}
.sheet h2{
  font-size:.95rem; font-weight:700; letter-spacing:.01em;
  margin:2.1rem 0 .1rem; padding-bottom:.3rem;
  border-bottom:1.5px solid var(--ink);
}
.sheet .job{margin-top:1.15rem; break-inside:avoid}
.sheet .job-head{display:flex; justify-content:space-between; gap:1rem; align-items:baseline}
.sheet .job-title{font-size:1rem; font-weight:700; margin:0}
.sheet .job-org{font-size:.92rem; color:var(--ink-soft); margin:.1rem 0 0}
.sheet .job-dates{font-size:.82rem; color:var(--ink-soft); white-space:nowrap}
.sheet ul{margin:.45rem 0 0; padding-left:1.1rem}
.sheet li{font-size:.92rem; line-height:1.55; margin-bottom:.3rem}
.sheet li::marker{color:var(--ink-soft)}
.sheet li.soft{background:linear-gradient(transparent 62%, #ffe9a8 62%)}
.sheet .cols{display:grid; grid-template-columns:1fr 1fr; gap:.2rem 2rem; margin-top:.7rem}
.sheet .entry{margin-bottom:.6rem; break-inside:avoid}
.sheet .entry-main{font-size:.92rem; font-weight:600}
.sheet .entry-sub{font-size:.85rem; color:var(--ink-soft)}
.sheet .skillrow{display:flex; gap:.6rem; font-size:.92rem; line-height:1.55; margin:.4rem 0}
.sheet .skillrow dt{font-weight:700; flex:0 0 9.5rem}
.sheet .skillrow dd{margin:0; color:var(--ink)}

@media (max-width:640px){
  .sheet{padding:1.9rem 1.4rem; margin:.8rem .6rem 3rem}
  .sheet .name{font-size:1.9rem}
  .sheet .cols{grid-template-columns:1fr}
  .sheet .skillrow{flex-direction:column; gap:.05rem}
  .sheet .skillrow dt{flex:none}
  .sheet .job-head{flex-direction:column}
}

/* ------------------------------------------------------------- impressao */
@page{margin:14mm 15mm}
@media print{
  :root{--backdrop:#fff; --ink:#000; --ink-soft:#3a4149}
  body{background:#fff !important}
  .no-print{display:none !important}
  .sheet{
    display:block !important;
    box-shadow:none; margin:0; padding:0; max-width:none;
  }
  .sheet li.soft{background:none}
  .sheet h2{margin-top:1.5rem}
  .sheet a{text-decoration:none; color:inherit}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important; animation:none !important}}


/* ===== desenho da tela ===== */
:root{
  --bg:#0b0e11;
  --surface:#131a1f;
  --surface-2:#182129;
  --line:#25313a;
  --fg:#e9eef1;
  --fg-dim:#9aabb5;
  --brand:#3ddc97;
  --brand-dim:rgba(61,220,151,.14);
}
@media screen{ .sheet{display:none} }

body{
  margin:0; background:var(--bg); color:var(--fg);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased; line-height:1.6;
}
.wrap{max-width:64rem; margin:0 auto; padding:0 1.5rem}
a{color:var(--brand); text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--brand); outline-offset:3px; border-radius:2px}

/* ------------------------------------------------------------- topo fixo */
.topbar{
  position:sticky; top:0; z-index:20;
  background:rgba(11,14,17,.82); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.topbar .wrap{display:flex; align-items:center; gap:1rem; height:3.5rem}
.mark{font-weight:600; letter-spacing:-.01em; color:var(--fg)}
.mark:hover{text-decoration:none}
.topbar .spacer{flex:1}
.topbar a.plain{color:var(--fg-dim); font-size:.87rem}
.topbar a.plain:hover{color:var(--fg); text-decoration:none}
.btn{
  font:inherit; font-size:.87rem; font-weight:500; cursor:pointer;
  padding:.45rem .9rem; border-radius:6px;
  border:1px solid var(--brand); background:var(--brand-dim); color:var(--brand);
  transition:background .15s, transform .15s;
}
.btn:hover{background:rgba(61,220,151,.22)}
.btn:active{transform:translateY(1px)}

/* ------------------------------------------------------------------ hero */
.hero{padding:5rem 0 3rem; position:relative; overflow:hidden}
.hero .eyebrow{
  font-size:.78rem; letter-spacing:.12em; text-transform:uppercase;
  color:var(--brand); margin:0 0 1rem;
}
.hero h1{
  font-family:"Source Serif 4",Georgia,serif; font-weight:700;
  font-size:clamp(2.6rem,7vw,4.4rem); line-height:1.02; letter-spacing:-.02em;
  margin:0;
}
.hero .role{
  font-size:clamp(1.05rem,2.4vw,1.35rem); color:var(--fg-dim);
  margin:.7rem 0 0; font-weight:400;
}
.hero .pitch{max-width:44rem; margin:1.6rem 0 0; color:var(--fg-dim)}
.hero .cta{display:flex; flex-wrap:wrap; gap:.7rem; margin-top:2rem}
.hero .cta a{
  font-size:.9rem; padding:.55rem 1rem; border-radius:6px;
  border:1px solid var(--line); color:var(--fg); background:var(--surface);
  transition:border-color .15s, background .15s;
}
.hero .cta a:hover{border-color:var(--brand); background:var(--surface-2); text-decoration:none}
.hero .cta a.primary{border-color:var(--brand); color:var(--brand); background:var(--brand-dim)}

/* grade de fundo: linguagem de eixo, sem fingir que e um grafico */
.grid-bg{
  position:absolute; inset:0; z-index:-1; opacity:.5;
  background-image:linear-gradient(var(--line) 1px, transparent 1px),
                   linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size:100% 4.5rem, 4.5rem 100%;
  mask-image:radial-gradient(ellipse 80% 60% at 30% 0%, #000 20%, transparent 75%);
  -webkit-mask-image:radial-gradient(ellipse 80% 60% at 30% 0%, #000 20%, transparent 75%);
}

/* --------------------------------------------------------------- numeros */
.stats{
  display:grid; grid-template-columns:repeat(auto-fit,minmax(9.5rem,1fr));
  gap:1px; background:var(--line); border:1px solid var(--line);
  border-radius:10px; overflow:hidden; margin:1rem 0 0;
}
.stat{background:var(--surface); padding:1.4rem 1.2rem}
.stat b{
  display:block; font-family:"Source Serif 4",Georgia,serif;
  font-size:2.2rem; font-weight:700; letter-spacing:-.02em; color:var(--fg);
  font-variant-numeric:tabular-nums;
}
.stat span{font-size:.82rem; color:var(--fg-dim); line-height:1.35; display:block; margin-top:.2rem}

/* ------------------------------------------------------------- secoes */
section{padding:4.5rem 0 0}
h2.section{
  font-family:"Source Serif 4",Georgia,serif; font-size:1.6rem; font-weight:700;
  letter-spacing:-.015em; margin:0 0 .4rem;
}
.section-note{color:var(--fg-dim); font-size:.9rem; margin:0 0 1.8rem}

/* ------------------------------------------------- linha do tempo (gantt) */
.gantt-chart{--label-w:8.5rem; --gap:1rem; margin-bottom:2.8rem}
.gantt-plot{position:relative}
.gantt{display:flex; flex-direction:column; gap:.5rem}
.gantt-row{display:grid; grid-template-columns:var(--label-w) 1fr; gap:var(--gap); align-items:center}
.gantt-label{font-size:.85rem; color:var(--fg-dim); text-align:right}
.gantt-track{background:var(--surface); border-radius:5px; height:2.1rem; position:relative}
.gantt-bar{
  position:absolute; top:0; bottom:0; border-radius:5px;
  background:linear-gradient(90deg, var(--brand-dim), rgba(61,220,151,.32));
  border:1px solid rgba(61,220,151,.45);
  transform-origin:left center; transform:scaleX(0); transition:transform .8s cubic-bezier(.2,.7,.3,1);
}
.in .gantt-bar{transform:scaleX(1)}

/* grade e rotulos caem na posicao real do ano dentro do periodo */
.gantt-grid{
  position:absolute; left:calc(var(--label-w) + var(--gap)); right:0; top:0; bottom:0;
  pointer-events:none;
}
.gantt-grid i{position:absolute; top:0; bottom:0; width:1px; background:var(--line)}
.gantt-axis{
  display:grid; grid-template-columns:var(--label-w) 1fr; gap:var(--gap);
  font-size:.75rem; color:var(--fg-dim); margin-top:.5rem;
}
.gantt-axis .ticks{position:relative; height:1em}
.gantt-axis .ticks span{position:absolute; transform:translateX(-50%); white-space:nowrap}

/* ------------------------------------------------------------- empregos */
.job-card{
  border:1px solid var(--line); border-radius:10px; background:var(--surface);
  padding:1.5rem; margin-bottom:1rem;
}
.job-card header{display:flex; flex-wrap:wrap; gap:.3rem 1rem; align-items:baseline; justify-content:space-between}
.job-card h3{font-size:1.05rem; margin:0; font-weight:600}
.job-card .org{color:var(--brand); font-size:.92rem; margin:.15rem 0 0}
.job-card .when{color:var(--fg-dim); font-size:.82rem; font-variant-numeric:tabular-nums}
.job-card ul{margin:1rem 0 0; padding-left:1.1rem; color:var(--fg-dim)}
.job-card li{margin-bottom:.45rem; font-size:.92rem}
.job-card li::marker{color:var(--brand)}

/* --------------------------------------------------------------- skills */
.skill-group{margin-bottom:1.4rem}
.skill-group h3{font-size:.8rem; text-transform:uppercase; letter-spacing:.1em; color:var(--fg-dim); margin:0 0 .6rem}
.chips{display:flex; flex-wrap:wrap; gap:.4rem}
.chip{
  border:1px solid var(--line); background:var(--surface); border-radius:99px;
  padding:.32rem .8rem; font-size:.85rem; color:var(--fg);
}

/* ----------------------------------------------------------- formacao */
.two-col{display:grid; grid-template-columns:1fr 1fr; gap:2.5rem}
.item{margin-bottom:1rem}
.item .main{font-size:.93rem; font-weight:500}
.item .sub{font-size:.83rem; color:var(--fg-dim)}

/* ---------------------------------------------------------------- rodape */
footer{margin-top:5rem; border-top:1px solid var(--line); padding:2.5rem 0 3.5rem; color:var(--fg-dim); font-size:.88rem}
footer .row{display:flex; flex-wrap:wrap; gap:1rem; align-items:center}
footer .spacer{flex:1}

/* --------------------------------------------------------------- reveal */
.reveal{opacity:0; transform:translateY(14px); transition:opacity .5s ease, transform .5s ease}
.reveal.in{opacity:1; transform:none}

@media (max-width:720px){
  .two-col{grid-template-columns:1fr; gap:1rem}
  .gantt-chart{--label-w:5.5rem; --gap:.6rem}
  .gantt-label{font-size:.78rem}
  .hero{padding-top:3.5rem}
  .topbar a.plain.hide-sm{display:none}
}

@media (prefers-reduced-motion:reduce){
  .reveal{opacity:1; transform:none; transition:none}
  .gantt-bar{transform:scaleX(1); transition:none}
}
</style>
</head>

<script>
/*
  Renderizacao da FOLHA. Compartilhada pelas tres saidas (folha de trabalho,
  versao publica e home), para o desenho do PDF nao divergir entre elas.

  Espera window.RESUME_DATA, gerado por src/render_resume.py a partir do
  resume/master.yaml. Nao guarda dado nenhum.
*/

let DATA = null;

const esc = s => String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

// Escolhe os bullets de cada emprego: cada tag vale a posicao dela na
// prioridade da variante, e os melhores ficam -- na ordem original, para o
// texto nao embaralhar.
function pick(bullets, priority, max){
  const score = b => b.tags.reduce((t,tag)=>{
    const i = priority.indexOf(tag);
    return t + (i === -1 ? 0 : priority.length - i);
  },0);
  const chosen = bullets.map((b,i)=>({b,i,s:score(b)}))
    .sort((x,y)=> y.s - x.s || x.i - y.i)
    .slice(0,max)
    .sort((x,y)=> x.i - y.i);
  return chosen.map(x=>x.b);
}

function entries(list){
  return `<div class="cols">${list.map(e=>
    `<div class="entry"><div class="entry-main">${esc(e.main)}</div>
     <div class="entry-sub">${esc(e.sub)}</div></div>`).join("")}</div>`;
}

function render(key){
  const sheet = document.getElementById("sheet");
  if (!sheet) return;

  const v = DATA.variants[key], m = DATA.meta, S = DATA.strings || {};
  const contact = [m.email, m.phone, m.location, m.linkedin, m.github, m.note]
    .filter(Boolean).join(" · ");

  const jobs = DATA.experience.map(j=>{
    const bs = pick(j.bullets, v.tag_priority, v.max);
    return `<div class="job">
      <div class="job-head">
        <div><p class="job-title">${esc(j.title)}</p>
        <p class="job-org">${esc(j.company)}${j.context?" · "+esc(j.context):""}</p></div>
        <span class="job-dates">${esc(j.dates)}</span>
      </div>
      <ul>${bs.map(b=>`<li data-c="${b.c}">${esc(b.text)}</li>`).join("")}</ul>
    </div>`;
  }).join("");

  const skills = v.skills.map(k=>{
    const s = DATA.skills[k];
    return `<div class="skillrow"><dt>${esc(s.label)}</dt><dd>${esc(s.items.join(" · "))}</dd></div>`;
  }).join("");

  sheet.innerHTML = `
    <h1 class="name">${esc(m.name)}</h1>
    <p class="headline">${esc(v.headline)}</p>
    <p class="contact">${esc(contact)}</p>
    <p class="summary">${esc(v.summary)}</p>
    <h2>${esc(S.experience || "Experience")}</h2>${jobs}
    <h2>${esc(S.skills || "Skills")}</h2><dl>${skills}</dl>
    <h2>${esc(S.education || "Education")}</h2>${entries(DATA.education)}
    <h2>${esc(S.certificates || "Certifications")}</h2>${entries(DATA.certificates)}
    <h2>${esc(S.languages || "Languages")}</h2>
    <p class="contact" style="margin-top:.5rem">${esc(DATA.languages)}</p>`;

  document.title = `${m.name} — ${v.label}`;
  applyFlags();
}

// So existe na folha de trabalho; nas outras saidas o checkbox nao esta la.
function applyFlags(){
  const box = document.getElementById("flagSoft");
  const on = !!(box && box.checked);
  document.querySelectorAll("#sheet li").forEach(li=>{
    li.classList.toggle("soft", on && li.dataset.c !== "exact");
  });
}

</script>
<script>
DATA = window.RESUME_DATA;
const M = DATA.meta, V = DATA.variants[VARIANT];
const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

// ---------------------------------------------------------------- hero
document.getElementById("eyebrow").textContent =
  [M.location, V.eyebrow].filter(Boolean).join(" · ");
document.getElementById("heroName").textContent = M.name;
document.getElementById("heroRole").textContent = V.headline;
document.getElementById("heroPitch").textContent = V.summary;
document.getElementById("heroCta").innerHTML =
  `<a class="primary" href="mailto:${esc(M.email)}">${esc(STR.email)}</a>` +
  (M.linkedin ? `<a href="https://${esc(M.linkedin)}" target="_blank" rel="noopener">LinkedIn</a>` : "") +
  `<a href="get-resume/">${esc(STR.onepage)}</a>`;
document.getElementById("footContact").textContent =
  [M.email, M.location, M.note].filter(Boolean).join(" · ");

// -------------------------------------------------------------- numeros
document.getElementById("stats").innerHTML = (DATA.highlights || []).map(h=>
  `<div class="stat"><b data-to="${h.number}" data-suffix="${esc(h.suffix || "")}">0${esc(h.suffix || "")}</b>
   <span>${esc(h.label)}</span></div>`).join("");

function countUp(el){
  const to = Number(el.dataset.to), suffix = el.dataset.suffix || "";
  if (reduced){ el.textContent = to + suffix; return; }
  const dur = 1100, t0 = performance.now();
  const step = now => {
    const p = Math.min(1, (now - t0) / dur);
    const eased = 1 - Math.pow(1 - p, 3);
    el.textContent = Math.round(to * eased) + suffix;
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

// ------------------------------------------------- linha do tempo real
// Largura de cada barra = duracao real do emprego em meses. Nada estimado:
// vem das datas do master.yaml.
function months(d){
  if (!d) return null;
  if (String(d).toLowerCase() === "present") return new Date();
  const [y, m] = String(d).split("-").map(Number);
  return new Date(y, (m || 1) - 1, 1);
}
function buildGantt(){
  const jobs = DATA.experience.map(j=>({
    company:j.company, from:months(j.start_raw), to:months(j.end_raw), dates:j.dates
  })).filter(j=>j.from);
  if (!jobs.length) return;
  const min = new Date(Math.min(...jobs.map(j=>+j.from)));
  const max = new Date(Math.max(...jobs.map(j=>+j.to)));
  const span = +max - +min;
  const pct = d => ((+d - +min) / span) * 100;

  // A barra nao carrega texto: em periodo curto (Boston, um ano) a data era
  // cortada no meio. As datas ficam no card de cada emprego, logo abaixo.
  const rows = jobs.slice().reverse().map(j=>
    `<div class="gantt-row">
      <div class="gantt-label">${esc(j.company)}</div>
      <div class="gantt-track">
        <div class="gantt-bar" title="${esc(j.company)}: ${esc(j.dates)}"
             style="left:${pct(j.from).toFixed(2)}%;width:${(pct(j.to) - pct(j.from)).toFixed(2)}%"></div>
      </div></div>`).join("");

  // Um tick por ano par que caiba dentro do periodo, na posicao real dele.
  const years = [];
  for (let y = min.getFullYear() + 1; y <= max.getFullYear(); y++){
    if (y % 2 === 0) years.push(y);
  }
  const ticks = years.map(y=>({y, p: pct(new Date(y, 0, 1))}))
                     .filter(t => t.p >= 0 && t.p <= 100);

  document.getElementById("gantt").innerHTML =
    `<div class="gantt-chart">
       <div class="gantt-plot">
         <div class="gantt">${rows}</div>
         <div class="gantt-grid">${
           ticks.map(t=>`<i style="left:${t.p.toFixed(2)}%"></i>`).join("")}</div>
       </div>
       <div class="gantt-axis"><span></span><span class="ticks">${
         ticks.map(t=>`<span style="left:${t.p.toFixed(2)}%">${t.y}</span>`).join("")}</span></div>
     </div>`;
}
buildGantt();

// ------------------------------------------------------------- empregos
document.getElementById("jobs").innerHTML = DATA.experience.map(j=>{
  const bs = pick(j.bullets, V.tag_priority, 3);
  return `<article class="job-card reveal">
    <header>
      <div><h3>${esc(j.title)}</h3><p class="org">${esc(j.company)}${
        j.context ? " · " + esc(j.context) : ""}</p></div>
      <span class="when">${esc(j.dates)}</span>
    </header>
    <ul>${bs.map(b=>`<li>${esc(b.text)}</li>`).join("")}</ul>
  </article>`;
}).join("");

// --------------------------------------------------------------- skills
document.getElementById("skills").innerHTML = V.skills.map(k=>{
  const s = DATA.skills[k];
  return `<div class="skill-group"><h3>${esc(s.label)}</h3><div class="chips">${
    s.items.map(i=>`<span class="chip">${esc(i)}</span>`).join("")}</div></div>`;
}).join("");

// ------------------------------------------------------------- formacao
const col = (title, list) =>
  `<div><h3 class="skill-group" style="margin-bottom:.8rem">${esc(title)}</h3>${
    list.map(e=>`<div class="item"><div class="main">${esc(e.main)}</div>
      <div class="sub">${esc(e.sub)}</div></div>`).join("")}</div>`;
document.getElementById("credentials").innerHTML =
  col(STR.education, DATA.education) + col(STR.certificates, DATA.certificates);

// ---------------------------------------------- revelar e contar numeros
const io = new IntersectionObserver((items, obs)=>{
  items.forEach(entry=>{
    if (!entry.isIntersecting) return;
    entry.target.classList.add("in");
    entry.target.querySelectorAll("b[data-to]").forEach(countUp);
    obs.unobserve(entry.target);
  });
}, {rootMargin:"0px 0px -10% 0px"});
document.querySelectorAll(".reveal").forEach(el=>io.observe(el));

// --------------------------------------------------- folha e exportacao
render(VARIANT);
document.title = "Matheos Pires — People Analytics | Workforce Analytics";
document.getElementById("exportBtn").addEventListener("click", ()=>window.print());
</script>
